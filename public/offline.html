<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E9">
  <title>Sem conexão · Estoq</title>
  <style>
    :root{color-scheme:light;--bg:#F4F0E9;--paper:#FCFAF6;--ink:#27332B;--muted:#667066;--accent:#426B57;--line:#E4E2D9;font-family:"DM Sans",Inter,"Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.6;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
    main{width:100%;max-width:440px;padding:32px;border:1px solid var(--line);border-radius:22px;background:var(--paper)}.brand{font-family:Fraunces,"DM Serif Display",Georgia,serif;font-size:28px;color:var(--accent);margin:0 0 32px}
    h1{font-family:Fraunces,"DM Serif Display",Georgia,serif;font-weight:400;font-size:34px;line-height:1.2;margin:0 0 18px}p{font-size:14px;color:var(--muted);margin:0 0 18px}a{display:flex;align-items:center;justify-content:center;min-height:49px;padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--paper);text-decoration:none;font-size:14px;font-weight:500;margin-top:28px}a:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151917;--paper:#1F2421;--ink:#F1F0E9;--muted:#A3ABA4;--accent:#A8CCB1;--line:#343B36}}
    @media(max-width:380px){main{padding:24px}h1{font-size:30px}}
  </style>
</head>
<body>
  <main>
    <p class="brand">Estoq</p>
    <h1>Conecte-se para continuar.</h1>
    <p>O Estoq precisa de internet para abrir os dados e salvar suas visitas.</p>
    <p>Se você estava fazendo uma contagem, entre com a mesma conta neste aparelho para retomar seu rascunho quando a conexão voltar.</p>
    <a href="/">Tentar novamente</a>
  </main>
</body>
</html>
